name: On Pull Request

on:
  pull_request:
  merge_group:

jobs:
  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    if: failure()
    timeout-minutes: 10
    permissions: {}
    steps: [{ run: exit 1 }]
    needs: [terraform-ci]

  terraform-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      targets: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: dorny/paths-filter@v3.0.2
        id: filter
        with:
          filters: |
            gcloud:
              - aqua.yaml
              - .github/workflows
              - terraform/gcloud

  terraform-ci:
    needs: [terraform-changes]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.terraform-changes.outputs.targets) }}
    uses: ./.github/workflows/wf-terraform-plan.yaml
    with:
      target: ${{ matrix.target }}

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "This is dummy job"

