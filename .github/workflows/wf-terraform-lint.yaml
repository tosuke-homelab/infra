name: Terraform Lint

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquaproj/aqua-installer@d1fe50798dbadd4eb5b98957290ca175f6b4870f # v4.0.2
        with:
          aqua_version: v2.53.3

      - name: Run tflint
        id: tflint
        continue-on-error: true
        uses: suzuki-shunsuke/github-action-tflint@a9d1f3376c8bbd6aadf4891dfe32f5e246c9c52f # v1.2.1
        with:
          working_directory: terraform/${{ inputs.target }}

      - name: Run tfsec
        id: tfsec
        continue-on-error: true
        uses: suzuki-shunsuke/github-action-tfsec@6b4afce3060c0d8865d269de0c5fabc90e1b20f7 # v1.0.0
        with:
          working_directory: terraform/${{ inputs.target }}
          
      - name: Check lint results
        if: steps.tflint.outcome == 'failure' || steps.tfsec.outcome == 'failure'
        run: |
          echo "::error::Terraform lint checks failed"
          exit 1
