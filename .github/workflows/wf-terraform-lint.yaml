name: Terraform Lint

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.53.3

      - name: Run tflint
        id: tflint
        continue-on-error: true
        uses: suzuki-shunsuke/github-action-tflint@bd4ef9de624ea35f63b554d4d20a26b6b32d1913 # v1.3.0
        with:
          working_directory: terraform/${{ inputs.target }}

      - name: Run tfsec
        id: tfsec
        continue-on-error: true
        uses: suzuki-shunsuke/github-action-tfsec@6b4afce3060c0d8865d269de0c5fabc90e1b20f7 # v1.0.0
        with:
          working_directory: terraform/${{ inputs.target }}
          
      - name: Check lint results
        if: steps.tflint.outcome == 'failure' || steps.tfsec.outcome == 'failure'
        run: |
          echo "::error::Terraform lint checks failed"
          exit 1
