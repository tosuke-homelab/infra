name: Changes

on:
  workflow_call:
    outputs:
      terraform-targets:
        value: ${{ jobs.changes.outputs.terraform-targets }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      terraform-targets: ${{ steps.terraform-filter.outputs.changes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: terraform-filter
        with:
          filters: |
            gcloud:
              - aqua.yaml
              - .github/workflows/**
              - terraform/gcloud/**
            linode:
              - aqua.yaml
              - .github/workflows/**
              - terraform/linode/**
